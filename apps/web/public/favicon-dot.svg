<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background tile matches favicon.svg so the swap during a
       realtime notification reads as "+ dot" rather than a wholesale
       brand change. -->
  <rect width="32" height="32" rx="7" fill="#E7EFE8"/>
  <text x="16" y="22" text-anchor="middle"
        font-family="Georgia, serif" font-size="20" font-weight="600"
        fill="#3D6F4F">P</text>
  <!-- Sage notification dot in the upper-right corner. Inner highlight
       keeps the dot legible against light browser themes. -->
  <circle cx="24" cy="8" r="6" fill="#3D6F4F" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
